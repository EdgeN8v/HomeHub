# NAS（极空间 Z2Pro）上的公网入口：公网 IPv6 的 8095 → 香橙派 HomeHub 后台 8200。
# 只转发 TCP 字节，不解密：TLS 由香橙派上的服务自己做（自签证书，手机 App 固定指纹），令牌也在那边校验。
# 部署：tools\deploy_nas.ps1。极空间防火墙里要放行 TCP 8095，并排在"拒绝其余"之前。
worker_processes 1;
events { worker_connections 256; }

stream {
    server {
        listen 8095;
        # 极空间的 Docker 会把公网 IPv6 连接转到容器内部的 IPv6 地址，所以必须也监听 [::]
        listen [::]:8095;
        proxy_pass 192.168.31.61:8200;
        proxy_connect_timeout 5s;
        proxy_timeout 1h;
    }
}
